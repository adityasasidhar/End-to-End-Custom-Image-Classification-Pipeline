# Data
data:
  root: "../data"
  batch_size: 64
  num_workers: 2

# Model
model:
  name: "resnet18"
  num_classes: 10
  pretrained: true
  freeze_backbone: true

# Training
training:
  epochs: 10
  lr: 0.001
  fine_tune_lr: 0.0001
  unfreeze_epoch: 5
  weight_decay: 0.0

# Scheduler
scheduler:
  step_size: 5
  gamma: 0.1

# Runtime
runtime:
  device: "auto"
  seed: 42
